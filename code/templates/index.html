<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SynchroForge – Control Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ── Header ────────────────────────────────────────── -->
  <header class="header">
    <div class="header-inner">
      <div class="title-block">
        <a href="/" class="back-link">← HOME</a>
        <h1 class="title">MAGCRAWLER</h1>
        <p class="subtitle">SYNCHROFORGE · CONTROL DASHBOARD</p>
      </div>
      <div class="header-right">
        <div class="status-block">
          <div class="status-dot"></div>
          <span class="status-text">LIVE</span>
        </div>
        <a href="/admin" class="admin-link">⚙ ADMIN</a>
      </div>
    </div>
    <div class="scanline"></div>
  </header>

  <!-- ── Main Grid ──────────────────────────────────────── -->
  <main class="main-grid">

    <!-- Camera Feed -->
    <section class="camera-section">
      <div class="section-label"><span class="label-icon">◈</span> CAMERA FEED</div>
      <div class="camera-frame">
        <div class="frame-corner tl"></div>
        <div class="frame-corner tr"></div>
        <div class="frame-corner bl"></div>
        <div class="frame-corner br"></div>
        <img
          id="camera-feed"
          src=""
          alt="Live Camera Feed"
          onerror="handleFeedError(this)"
        />
        <div class="feed-overlay">
          <span class="feed-tag">CAM-01</span>
          <span id="feed-status" class="feed-res">CONNECTING…</span>
        </div>
      </div>
    </section>

    <!-- Controls -->
    <section class="control-section">
      <div class="section-label"><span class="label-icon">◈</span> MOVEMENT CONTROL</div>

      <!-- Command log -->
      <div class="cmd-log" id="cmd-log">
        <span class="cmd-line">&gt; SYSTEM READY</span>
      </div>

      <!-- D-Pad -->
      <div class="control-pad">

        <button class="btn btn-forward"  id="btn-forward"  data-action="forward" aria-label="Forward">
          <span class="btn-icon">▲</span>
          <span class="btn-label">FORWARD</span>
        </button>

        <div class="btn-row-middle">
          <button class="btn btn-side" id="btn-left"  data-action="left"  aria-label="Left">
            <span class="btn-icon">◀</span>
            <span class="btn-label">LEFT</span>
          </button>

          <div class="center-dot"><div class="center-ring"></div></div>

          <button class="btn btn-side" id="btn-right" data-action="right" aria-label="Right">
            <span class="btn-icon">▶</span>
            <span class="btn-label">RIGHT</span>
          </button>
        </div>

        <button class="btn btn-backward" id="btn-backward" data-action="backward" aria-label="Backward">
          <span class="btn-icon">▼</span>
          <span class="btn-label">BACKWARD</span>
        </button>

      </div>

      <!-- Stop button -->
      <button class="btn btn-stop" id="btn-stop" data-action="stop" aria-label="Stop">
        ■ EMERGENCY STOP
      </button>

      <!-- ESP32 IP updater -->
      <div class="ip-updater">
        <input id="esp32-ip-input" type="text" class="ip-input"
          placeholder="ESP32 IP (e.g. 192.168.1.100)"
          value="{{ esp32_ip }}" />
        <button id="esp32-ip-btn" class="ip-btn">SET IP</button>
      </div>

      <!-- Keyboard hint -->
      <p class="kbd-hint">WASD / Arrow keys also work</p>
    </section>

  </main>

  <!-- ── Footer ─────────────────────────────────────────── -->
  <footer class="footer">
    SYNCHROFORGE &nbsp;|&nbsp; MAGCRAWLER v2.0 &nbsp;|&nbsp; ESP32-CAM DIRECT &nbsp;|&nbsp; 2026
  </footer>

  <script>
    // ── ESP32 IP — browser talks directly to ESP32 ────────
    let ESP32_IP = "{{ esp32_ip }}";

    function esp32Url(path)   { return `http://${ESP32_IP}${path}`; }
    function streamUrl()      { return `http://${ESP32_IP}:82/stream`; }

    // ── Camera feed (direct to ESP32 port 82) ─────────────
    const feedImg    = document.getElementById('camera-feed');
    const feedStatus = document.getElementById('feed-status');

    function loadStream() {
      feedImg.src = streamUrl() + '?t=' + Date.now();
    }

    feedImg.addEventListener('load', () => {
      feedStatus.textContent = 'LIVE';
      feedImg.style.opacity  = '1';
    });

    function handleFeedError(img) {
      feedStatus.textContent = 'NO SIGNAL';
      img.style.opacity = '0.2';
      setTimeout(loadStream, 5000);
    }

    // Start stream on page load
    loadStream();

    // ── Command log ───────────────────────────────────────
    const log = document.getElementById('cmd-log');
    function cmdLog(msg) {
      const line = document.createElement('span');
      line.className   = 'cmd-line';
      line.textContent = `> ${msg.toUpperCase()}`;
      log.appendChild(line);
      while (log.children.length > 5) log.removeChild(log.firstChild);
      log.scrollTop = log.scrollHeight;
    }

    // ── Send motor command directly to ESP32 port 80 ──────
    async function sendCmd(action, label) {
      try {
        const res  = await fetch(esp32Url(`/${action}`), { mode: 'cors' });
        const data = await res.json();
        cmdLog(`${label} → OK`);
      } catch (e) {
        cmdLog(`${label} → ERROR`);
      }
    }

    // ── Button handlers ───────────────────────────────────
    document.querySelectorAll('.btn[data-action]').forEach(btn => {
      btn.addEventListener('mousedown',  () => btn.classList.add('active'));
      btn.addEventListener('mouseup',    () => btn.classList.remove('active'));
      btn.addEventListener('mouseleave', () => btn.classList.remove('active'));
      // Touch support for mobile
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); btn.classList.add('active'); sendCmd(btn.dataset.action, btn.getAttribute('aria-label')); }, { passive: false });
      btn.addEventListener('touchend',   (e) => { e.preventDefault(); btn.classList.remove('active'); sendCmd('stop', 'Stop'); }, { passive: false });
      btn.addEventListener('click', () => sendCmd(btn.dataset.action, btn.getAttribute('aria-label')));
    });

    // ── Keyboard controls ─────────────────────────────────
    const keyMap = {
      ArrowUp:    { id: 'btn-forward',  action: 'forward',  label: 'Forward'  },
      ArrowDown:  { id: 'btn-backward', action: 'backward', label: 'Backward' },
      ArrowLeft:  { id: 'btn-left',     action: 'left',     label: 'Left'     },
      ArrowRight: { id: 'btn-right',    action: 'right',    label: 'Right'    },
      w: { id: 'btn-forward',  action: 'forward',  label: 'Forward'  },
      s: { id: 'btn-backward', action: 'backward', label: 'Backward' },
      a: { id: 'btn-left',     action: 'left',     label: 'Left'     },
      d: { id: 'btn-right',    action: 'right',    label: 'Right'    },
    };

    const pressed = new Set();
    document.addEventListener('keydown', (e) => {
      const m = keyMap[e.key];
      if (!m || pressed.has(e.key)) return;
      pressed.add(e.key);
      document.getElementById(m.id)?.classList.add('active');
      sendCmd(m.action, m.label);
    });
    document.addEventListener('keyup', (e) => {
      const m = keyMap[e.key];
      if (!m) return;
      pressed.delete(e.key);
      document.getElementById(m.id)?.classList.remove('active');
      sendCmd('stop', 'Stop');
    });

    // ── SET IP button ─────────────────────────────────────
    document.getElementById('esp32-ip-btn').addEventListener('click', () => {
      const ip = document.getElementById('esp32-ip-input').value.trim();
      if (!ip) return;
      ESP32_IP = ip;
      cmdLog(`ESP32 IP → ${ip}`);
      loadStream();
      // Also update Flask so admin page stays in sync
      fetch('/config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ip}) });
    });
  </script>

</body>
</html>
