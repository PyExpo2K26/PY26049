<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SynchroForge – Control Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ── Header ────────────────────────────────────────── -->
  <header class="header">
    <div class="header-inner">
      <div class="title-block">
        <a href="/" class="back-link">← HOME</a>
        <h1 class="title">MAGCRAWLER</h1>
        <p class="subtitle">SYNCHROFORGE · CONTROL DASHBOARD</p>
      </div>
      <div class="header-right">
        <div class="status-block">
          <div class="status-dot"></div>
          <span class="status-text">LIVE</span>
        </div>
        <a href="/admin" class="admin-link">⚙ ADMIN</a>
      </div>
    </div>
    <div class="scanline"></div>
  </header>

  <!-- ── Main Grid ──────────────────────────────────────── -->
  <main class="main-grid">

    <!-- Camera Feed -->
    <section class="camera-section">
      <div class="section-label"><span class="label-icon">◈</span> CAMERA FEED</div>
      <div class="camera-frame">
        <div class="frame-corner tl"></div>
        <div class="frame-corner tr"></div>
        <div class="frame-corner bl"></div>
        <div class="frame-corner br"></div>
        <img
          id="camera-feed"
          src="/camera/stream"
          alt="Live Camera Feed"
          onerror="handleFeedError(this)"
        />
        <div class="feed-overlay">
          <span class="feed-tag">CAM-01</span>
          <span id="feed-status" class="feed-res">CONNECTING…</span>
        </div>
      </div>
    </section>

    <!-- Controls -->
    <section class="control-section">
      <div class="section-label"><span class="label-icon">◈</span> MOVEMENT CONTROL</div>

      <!-- Command log -->
      <div class="cmd-log" id="cmd-log">
        <span class="cmd-line">&gt; SYSTEM READY</span>
      </div>

      <!-- D-Pad -->
      <div class="control-pad">

        <button class="btn btn-forward"  id="btn-forward"  data-route="/forward" aria-label="Forward">
          <span class="btn-icon">▲</span>
          <span class="btn-label">FORWARD</span>
        </button>

        <div class="btn-row-middle">
          <button class="btn btn-side" id="btn-left"  data-route="/left"  aria-label="Left">
            <span class="btn-icon">◀</span>
            <span class="btn-label">LEFT</span>
          </button>

          <div class="center-dot"><div class="center-ring"></div></div>

          <button class="btn btn-side" id="btn-right" data-route="/right" aria-label="Right">
            <span class="btn-icon">▶</span>
            <span class="btn-label">RIGHT</span>
          </button>
        </div>

        <button class="btn btn-backward" id="btn-backward" data-route="/backward" aria-label="Backward">
          <span class="btn-icon">▼</span>
          <span class="btn-label">BACKWARD</span>
        </button>

      </div>

      <!-- Stop button -->
      <button class="btn btn-stop" id="btn-stop" data-route="/stop" aria-label="Stop">
        ■ EMERGENCY STOP
      </button>

      <!-- ESP32 IP updater -->
      <div class="ip-updater">
        <input id="esp32-ip-input" type="text" class="ip-input"
          placeholder="ESP32 IP (e.g. 192.168.1.100)"
          value="{{ esp32_ip }}" />
        <button id="esp32-ip-btn" class="ip-btn">SET IP</button>
      </div>

      <!-- Keyboard hint -->
      <p class="kbd-hint">WASD / Arrow keys also work</p>
    </section>

  </main>

  <!-- ── Footer ─────────────────────────────────────────── -->
  <footer class="footer">
    SYNCHROFORGE &nbsp;|&nbsp; MAGCRAWLER v2.0 &nbsp;|&nbsp; ESP32-CAM DIRECT HTTP &nbsp;|&nbsp; 2026
  </footer>

  <script>
    // ── Camera feed ──────────────────────────────────────
    const feedImg    = document.getElementById('camera-feed');
    const feedStatus = document.getElementById('feed-status');

    feedImg.addEventListener('load', () => { feedStatus.textContent = 'LIVE'; feedImg.style.opacity = '1'; });
    function handleFeedError(img) {
      feedStatus.textContent = 'NO SIGNAL';
      img.style.opacity = '0.2';
      setTimeout(() => { img.src = '/camera/stream?t=' + Date.now(); }, 5000);
    }

    // ── ESP32 IP updater ─────────────────────────────────
    const ipInput = document.getElementById('esp32-ip-input');
    const ipBtn   = document.getElementById('esp32-ip-btn');
    if (ipBtn && ipInput) {
      ipBtn.addEventListener('click', async () => {
        const ip = ipInput.value.trim();
        if (!ip) return;
        try {
          const res  = await fetch('/config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ip}) });
          const data = await res.json();
          cmdLog(`ESP32 IP → ${data.esp32_ip}`);
          feedImg.src = '';
          feedImg.src = '/camera/stream?t=' + Date.now();
        } catch(e) { cmdLog('IP update error'); }
      });
    }

    // ── Command log ──────────────────────────────────────
    const log = document.getElementById('cmd-log');
    function cmdLog(msg) {
      const line = document.createElement('span');
      line.className = 'cmd-line';
      line.textContent = `> ${msg.toUpperCase()}`;
      log.appendChild(line);
      while (log.children.length > 5) log.removeChild(log.firstChild);
      log.scrollTop = log.scrollHeight;
    }

    // ── Send command to Flask route ──────────────────────
    async function sendCmd(route, label) {
      try {
        const res  = await fetch(route);
        const data = await res.json();
        cmdLog(`${label} → ${data.ok ? 'OK' : 'FAIL'}`);
      } catch (e) {
        cmdLog(`${label} → ERROR`);
      }
    }

    // ── Button click handlers ────────────────────────────
    document.querySelectorAll('.btn[data-route]').forEach(btn => {
      btn.addEventListener('mousedown', () => btn.classList.add('active'));
      btn.addEventListener('mouseup',   () => btn.classList.remove('active'));
      btn.addEventListener('mouseleave',() => btn.classList.remove('active'));
      btn.addEventListener('click', () => {
        const route = btn.dataset.route;
        const label = btn.getAttribute('aria-label') || route.replace('/', '');
        sendCmd(route, label);
      });
    });

    // ── Keyboard controls ────────────────────────────────
    const keyMap = {
      ArrowUp:    { id: 'btn-forward',  route: '/forward',  label: 'Forward'  },
      ArrowDown:  { id: 'btn-backward', route: '/backward', label: 'Backward' },
      ArrowLeft:  { id: 'btn-left',     route: '/left',     label: 'Left'     },
      ArrowRight: { id: 'btn-right',    route: '/right',    label: 'Right'    },
      w: { id: 'btn-forward',  route: '/forward',  label: 'Forward'  },
      s: { id: 'btn-backward', route: '/backward', label: 'Backward' },
      a: { id: 'btn-left',     route: '/left',     label: 'Left'     },
      d: { id: 'btn-right',    route: '/right',    label: 'Right'    },
    };

    const pressed = new Set();
    document.addEventListener('keydown', (e) => {
      const m = keyMap[e.key];
      if (!m || pressed.has(e.key)) return;
      pressed.add(e.key);
      document.getElementById(m.id)?.classList.add('active');
      sendCmd(m.route, m.label);
    });
    document.addEventListener('keyup', (e) => {
      const m = keyMap[e.key];
      if (!m) return;
      pressed.delete(e.key);
      document.getElementById(m.id)?.classList.remove('active');
      sendCmd('/stop', 'Stop');
    });
  </script>

</body>
</html>
